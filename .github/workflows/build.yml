name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.6"
  RUST_VERSION: "stable"

jobs:
  # ============================================================================
  # GO BUILD & TEST
  # ============================================================================
  build-go:
    name: Go Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Go (linux)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o excel2pdf-linux-amd64 ./example
          GOOS=linux GOARCH=arm64 go build -v -o excel2pdf-linux-arm64 ./example

      - name: Build Go (windows)
        if: runner.os == 'Windows'
        run: |
          $env:GOOS="windows"; $env:GOARCH="amd64"; go build -v -o excel2pdf-windows-amd64.exe ./example
          $env:GOOS="windows"; $env:GOARCH="arm64"; go build -v -o excel2pdf-windows-arm64.exe ./example

      - name: Build Go (darwin)
        if: runner.os == 'macOS'
        run: |
          GOOS=darwin GOARCH=amd64 go build -v -o excel2pdf-darwin-amd64 ./example
          GOOS=darwin GOARCH=arm64 go build -v -o excel2pdf-darwin-arm64 ./example

      - name: Upload Go coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.txt
          flags: go
          name: go-coverage

  # ============================================================================
  # RUST BUILD & TEST
  # Windows is excluded from the matrix because Excel COM interop requires a
  # real Windows environment with Microsoft Excel installed, which is not
  # available on GitHub Actions runners.
  # ============================================================================
  build-rust:
    name: Rust Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (verbose)
        run: cargo build --verbose

      - name: Test (lib only — Windows COM tests are skipped on Linux)
        run: cargo test --lib --verbose

  # ============================================================================
  # GO CROSS-COMPILE MATRIX (Additional targets)
  # ============================================================================
  build-go-cross:
    name: Go Cross-Compile - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="excel2pdf-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "dist/${OUTPUT_NAME}" ./example

      - name: Upload Go cross-compile artifacts
        uses: actions/upload-artifact@v7
        with:
          name: go-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ============================================================================
  # RUST CROSS-COMPILE MATRIX
  # Targets: Linux amd64, Linux arm64 (via cross).
  # Windows cross-compilation needs the MSVC target on a Windows runner.
  # ============================================================================
  build-rust-cross:
    name: Rust Cross-Compile - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for aarch64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --target ${{ matrix.target }} --verbose

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --target ${{ matrix.target }} --verbose

      - name: Upload cross-compile artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/debug/

  # ============================================================================
  # LINTING & CODE QUALITY
  # ============================================================================
  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  lint-rust:
    name: Rust Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-go:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload Gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  security-rust:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # GO VULNERABILITY CHECK
  # ============================================================================
  vuln-go:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ============================================================================
  # SUMMARY JOB
  # ============================================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        build-go,
        build-go-cross,
        lint-go,
        security-go,
        vuln-go,
        build-rust,
        build-rust-cross,
        lint-rust,
        security-rust,
      ]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-go.result }}" != "success" ]] || \
             [[ "${{ needs.build-go-cross.result }}" != "success" ]] || \
             [[ "${{ needs.lint-go.result }}" != "success" ]] || \
             [[ "${{ needs.security-go.result }}" != "success" ]] || \
             [[ "${{ needs.vuln-go.result }}" != "success" ]] || \
             [[ "${{ needs.build-rust.result }}" != "success" ]] || \
             [[ "${{ needs.build-rust-cross.result }}" != "success" ]] || \
             [[ "${{ needs.lint-rust.result }}" != "success" ]] || \
             [[ "${{ needs.security-rust.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All checks passed"
