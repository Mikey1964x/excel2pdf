name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.6"
  RUST_VERSION: "stable"

jobs:
  # ============================================================================
  # GO BUILD & TEST
  # ============================================================================
  build-go:
    name: Go Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Go (linux)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o excel2pdf-linux-amd64 ./example
          GOOS=linux GOARCH=arm64 go build -v -o excel2pdf-linux-arm64 ./example

      - name: Build Go (windows)
        if: runner.os == 'Windows'
        run: |
          $env:GOOS="windows"; $env:GOARCH="amd64"; go build -v -o excel2pdf-windows-amd64.exe ./example
          $env:GOOS="windows"; $env:GOARCH="arm64"; go build -v -o excel2pdf-windows-arm64.exe ./example

      - name: Build Go (darwin)
        if: runner.os == 'macOS'
        run: |
          GOOS=darwin GOARCH=amd64 go build -v -o excel2pdf-darwin-amd64 ./example
          GOOS=darwin GOARCH=arm64 go build -v -o excel2pdf-darwin-arm64 ./example

      - name: Upload Go coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: go
          name: go-coverage

  # ============================================================================
  # RUST BUILD & TEST (disabled - fix Go first)
  # ============================================================================
  build-rust:
    name: Rust Build & Test - ${{ matrix.os }}
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - run: echo "Rust jobs disabled"

  # ============================================================================
  # GO CROSS-COMPILE MATRIX (Additional targets)
  # ============================================================================
  build-go-cross:
    name: Go Cross-Compile - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="excel2pdf-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "dist/${OUTPUT_NAME}" ./example

      - name: Upload Go cross-compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ============================================================================
  # RUST CROSS-COMPILE MATRIX (disabled - fix Go first)
  # ============================================================================
  build-rust-cross:
    name: Rust Cross-Compile - ${{ matrix.target }}
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - run: echo "Rust jobs disabled"

  # ============================================================================
  # LINTING & CODE QUALITY
  # ============================================================================
  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  lint-rust:
    name: Rust Format & Lint (disabled - fix Go first)
    if: false
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rust jobs disabled"

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-go:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload Gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  security-rust:
    name: Rust Security Audit (disabled - fix Go first)
    if: false
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rust jobs disabled"

  # ============================================================================
  # SUMMARY JOB
  # ============================================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        build-go,
        build-go-cross,
        lint-go,
        security-go,
      ]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-go.result }}" != "success" ]] || \
             [[ "${{ needs.build-go-cross.result }}" != "success" ]] || \
             [[ "${{ needs.lint-go.result }}" != "success" ]] || \
             [[ "${{ needs.security-go.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All checks passed"
