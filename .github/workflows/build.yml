name: Build & Test

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.6"
  RUST_VERSION: "stable"

jobs:
  # ============================================================================
  # GO BUILD & TEST
  # ============================================================================
  build-go:
    name: Go Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Go (linux)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o excel2pdf-linux-amd64 ./example
          GOOS=linux GOARCH=arm64 go build -v -o excel2pdf-linux-arm64 ./example

      - name: Build Go (windows)
        if: runner.os == 'Windows'
        run: |
          $env:GOOS="windows"; $env:GOARCH="amd64"; go build -v -o excel2pdf-windows-amd64.exe ./example
          $env:GOOS="windows"; $env:GOARCH="arm64"; go build -v -o excel2pdf-windows-arm64.exe ./example

      - name: Build Go (darwin)
        if: runner.os == 'macOS'
        run: |
          GOOS=darwin GOARCH=amd64 go build -v -o excel2pdf-darwin-amd64 ./example
          GOOS=darwin GOARCH=arm64 go build -v -o excel2pdf-darwin-arm64 ./example

      - name: Upload Go coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: go
          name: go-coverage

  # ============================================================================
  # RUST BUILD & TEST
  # ============================================================================
  build-rust:
    name: Rust Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux targets
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # Windows targets
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          # macOS targets
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Run Rust tests
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --verbose --target ${{ matrix.target }}

      - name: Run Rust tests (with cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross test --verbose --target ${{ matrix.target }}

      - name: Build Rust (release)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --verbose --target ${{ matrix.target }}

      - name: Build Rust (release, with cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --verbose --target ${{ matrix.target }}

      - name: Run clippy lints
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

  # ============================================================================
  # GO CROSS-COMPILE MATRIX (Additional targets)
  # ============================================================================
  build-go-cross:
    name: Go Cross-Compile - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="excel2pdf-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          go build -v -o "dist/${OUTPUT_NAME}" ./example

      - name: Upload Go cross-compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # ============================================================================
  # RUST CROSS-COMPILE MATRIX (Additional targets)
  # ============================================================================
  build-rust-cross:
    name: Rust Cross-Compile - ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross

      - name: Build Rust library
        run: cross build --release --target ${{ matrix.target }}

      - name: Upload Rust cross-compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/

  # ============================================================================
  # LINTING & CODE QUALITY
  # ============================================================================
  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

  lint-rust:
    name: Rust Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  security-go:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec security scanner
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./..."

      - name: Upload Gosec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  security-rust:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # SUMMARY JOB
  # ============================================================================
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      [
        build-go,
        build-rust,
        build-go-cross,
        build-rust-cross,
        lint-go,
        lint-rust,
        security-go,
        security-rust,
      ]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build-go.result }}" != "success" ]] || \
             [[ "${{ needs.build-rust.result }}" != "success" ]] || \
             [[ "${{ needs.build-go-cross.result }}" != "success" ]] || \
             [[ "${{ needs.build-rust-cross.result }}" != "success" ]] || \
             [[ "${{ needs.lint-go.result }}" != "success" ]] || \
             [[ "${{ needs.lint-rust.result }}" != "success" ]] || \
             [[ "${{ needs.security-go.result }}" != "success" ]] || \
             [[ "${{ needs.security-rust.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All checks passed"
