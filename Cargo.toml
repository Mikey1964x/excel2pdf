[package]
name = "excel2pdf"
version = "0.1.0"
edition = "2021"
description = "Convert Excel (.xlsx) files to PDF and merge PDF files"
license = "MIT"

[dependencies]
lopdf = "0.42"
once_cell = "1"
tempfile = "3"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
